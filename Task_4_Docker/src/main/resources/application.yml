spring:
  application:
    name: task4
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:task4}
    username: ${DB_USER:task4}
    password: ${DB_PASS:task4}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

