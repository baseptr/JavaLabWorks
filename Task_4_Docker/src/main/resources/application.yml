  secret:
    access: kjdlgjsljjjskljlskfj;jhkjsjehsehkjehkjhhhhfdhdjfhjdfhkhdfh
    refresh: hjhsfhgkhsh7suehwkhkjsdbbjxjnnweuh;ajbsjautuxhnrjfzuh
  lifetime:
    access: 15 #minutes
    refresh: 1 #hours

management:
