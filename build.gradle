plugins {
    id 'java'
}

group = 'com.esdc'
version = '1.0-SNAPSHOT'

ext {
    springVersion = '6.2.11'
    springDataVersion = '3.4.1'
    jacksonVersion = '2.21.1'
    logbackVersion = '1.5.32'
    slf4jVersion = '2.0.16'
    lombokVersion = '1.18.44'
    hikariVersion = '7.0.2'
    postgresVersion = '42.7.10'
    h2Version = '2.3.232'
    junitVersion = '5.11.4'
    mockitoVersion = '5.23.0'
    jakartaVersion = '6.1.0'
    tomcatEmbedVersion = '11.0.21'
    jakartaValidationVersion = '3.0.2'
    hibernateValidatorVersion = '8.0.1.Final'
    springdocVersion = '3.0.2'
    springSecurityVersion = '6.5.7'
    jjwtVersion = '0.13.0'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

dependencies {
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
}

