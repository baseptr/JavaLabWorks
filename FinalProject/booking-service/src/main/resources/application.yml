spring:
  application:
    name: booking-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking}
    username: ${DB_USER:booking}
    password: ${DB_PASS:booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
#    show-sql: true
#    properties:
#      hibernate:
#        format_sql: true
  flyway:
    enabled: true
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret:
    access: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-0123456789}
    refresh: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-0123456789}
  lifetime:
    access: 1    # часы
    refresh: 7   # дни

management:
  endpoints:
    web:
      exposure:
        include: health,info
